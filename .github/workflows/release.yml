# SPDX-License-Identifier: GPL-3.0-only
# KRIECHSTROM: a release, built and signed by GitHub. On a version tag (git tag v0.3.1 && git push origin v0.3.1) the
# Firmware Hub's shared workflow (zvenson/fm1-build, a reviewed tag of it) checks out this commit, builds the package
# with ./build.sh, attests it (a signed statement: this file was built from this commit) and publishes it as the
# release of the tag. The hub then shows "Built from source on GitHub". Do not replace or add the .fwsc by hand
# afterwards: the hub compares its SHA-256 with the attested one. Check a package with
#   gh attestation verify kriechstrom-X.Y.fwsc --repo Xforsa/kriechstrom \
#     --signer-workflow zvenson/fm1-build/.github/workflows/build.yml
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write          # the release
      id-token: write          # the signing certificate
      attestations: write      # the attestation
    with:
      build: ./build.sh --release "${GITHUB_REF_NAME#v}"
      packages: build/kriechstrom-*.fwsc   # (build/felucca-*.fwsc is the same package under Felucca's name, for the tests)
