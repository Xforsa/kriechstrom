name: Bug report
description: Something in KRIECHSTROM doesn't work as it should (one bug per issue)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are for reproducible bugs only. Ideas and questions go to [Discussions](https://github.com/Xforsa/kriechstrom/discussions).
  - type: input
    id: version
    attributes:
      label: KRIECHSTROM version
      description: Hold HOME, SYSTEM > ABOUT on the FM-1
      placeholder: "v0.1"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer, OS and browser (if the editor, installer or USB is involved)
      placeholder: "macOS 15.6, Chrome 140"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A photo or short video helps.
    validations:
      required: true
